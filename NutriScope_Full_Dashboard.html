<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriScope SaaS Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{margin:0;font-family:Inter,Arial,sans-serif;background:#07111f;color:#fff}
.container{padding:20px;max-width:1400px;margin:auto}
.header{font-size:34px;font-weight:700;color:#4ade80;margin-bottom:20px}
.grid{display:grid;grid-template-columns:320px 1fr;gap:20px}
.card{background:#0f1b2d;border:1px solid #24364f;border-radius:18px;padding:18px}
input,select{width:100%;padding:10px;margin:6px 0 12px;background:#091321;color:#fff;border:1px solid #24364f;border-radius:10px}
button{width:100%;padding:12px;background:#22c55e;border:none;border-radius:10px;font-weight:700}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.metric{background:#0f1b2d;border-radius:18px;padding:18px}
.metric h3{margin:0;color:#9ca3af}
.metric p{font-size:28px;margin:10px 0 0}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #24364f}
@media(max-width:900px){
.grid{grid-template-columns:1fr}
.metrics,.charts{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">
<div class="header">NutriScope</div>

<div class="grid">
<div class="card">
<h2>Your Profile</h2>
<input placeholder="Age">
<select><option>Gender</option></select>
<input placeholder="Height (cm)">
<input placeholder="Weight (kg)">
<select><option>Activity Level</option></select>
<select><option>Dietary Preference</option></select>
<button>Calculate Targets</button>
</div>

<div>
<div class="metrics">
<div class="metric"><h3>Calories</h3><p>1560</p></div>
<div class="metric"><h3>Protein</h3><p>72g</p></div>
<div class="metric"><h3>Carbs</h3><p>210g</p></div>
<div class="metric"><h3>Fat</h3><p>48g</p></div>
</div>

<div class="card" style="margin-top:20px">
<h2>Food Logger</h2>
<table>
<tr><th>Food</th><th>Qty</th><th>Calories</th></tr>
<tr><td>Rice</td><td>150g</td><td>195</td></tr>
<tr><td>Paneer</td><td>100g</td><td>265</td></tr>
<tr><td>Banana</td><td>1</td><td>105</td></tr>
</table>
</div>

<div class="charts">
<div class="card">
<h2>Energy Progress</h2>
<canvas id="energy"></canvas>
</div>
<div class="card">
<h2>Macro Distribution</h2>
<canvas id="macro"></canvas>
</div>
</div>

<div class="card" style="margin-top:20px">
<h2>Nutrient Progress</h2>
<table>
<tr><th>Nutrient</th><th>Consumed</th><th>Target</th></tr>
<tr><td>Protein</td><td>72g</td><td>115g</td></tr>
<tr><td>Fiber</td><td>18g</td><td>30g</td></tr>
<tr><td>Iron</td><td>7.2mg</td><td>17mg</td></tr>
</table>
</div>
</div>
</div>
</div>

<script>
new Chart(document.getElementById('energy'),{
type:'doughnut',
data:{labels:['Consumed','Remaining'],
datasets:[{data:[1560,740]}]}
});

new Chart(document.getElementById('macro'),{
type:'pie',
data:{labels:['Protein','Carbs','Fat'],
datasets:[{data:[72,210,48]}]}
});
</script>
</body>
</html>
